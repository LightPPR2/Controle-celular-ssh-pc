name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Criar estrutura Android e compilar
        run: |
          flutter create . --platforms=android --project-name controle_celular_ssh_pc
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Controle SSH Pc"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-controle-ssh
          path: build/app/outputs/flutter-apk/app-release.apk
